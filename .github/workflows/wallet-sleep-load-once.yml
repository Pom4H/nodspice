name: Add wallet sleep load once

on:
  push:
    paths:
      - .github/workflows/wallet-sleep-load-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Split MCU active and sleep branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/domain/examples.ts')
          source = path.read_text()
          source = source.replace(
              "    { id: 'r-mcu', kind: 'resistor', label: 'MCU ~45mA', x: 855, y: 260, properties: { resistance: 73.3 } },\n",
              "    { id: 's-mcu-active', kind: 'switch', label: 'CPU ACTIVE', x: 820, y: 105, properties: { closed: true, onResistance: 0.02, offResistance: 10e6 } },\n    { id: 'r-mcu-active', kind: 'resistor', label: 'MCU ~45mA', x: 870, y: 255, properties: { resistance: 73.3 } },\n    { id: 's-mcu-sleep', kind: 'switch', label: 'CPU WFI', x: 820, y: 410, properties: { closed: false, onResistance: 0.02, offResistance: 10e6 } },\n    { id: 'r-mcu-sleep', kind: 'resistor', label: 'MCU sleep ~0.1mA', x: 970, y: 410, properties: { resistance: 33_000 } },\n",
              1,
          )
          source = source.replace(
              "    wire('ldo-mcu', 'r-ldo', 'b', 'r-mcu', 'a'),\n",
              "    wire('rail-mcu-active-switch', 'r-ldo', 'b', 's-mcu-active', 'a'),\n    wire('mcu-active-switch-load', 's-mcu-active', 'b', 'r-mcu-active', 'a'),\n    wire('rail-mcu-sleep-switch', 'r-ldo', 'b', 's-mcu-sleep', 'a'),\n    wire('mcu-sleep-switch-load', 's-mcu-sleep', 'b', 'r-mcu-sleep', 'a'),\n",
              1,
          )
          source = source.replace(
              "    wire('mcu-ground', 'r-mcu', 'b', 'g-wallet', 'gnd'),\n",
              "    wire('mcu-active-ground', 'r-mcu-active', 'b', 'g-wallet', 'gnd'),\n    wire('mcu-sleep-ground', 'r-mcu-sleep', 'b', 'g-wallet', 'gnd'),\n",
              1,
          )
          source = source.replace(
              "    description: 'USB cable drop, input/output decoupling, display load and an optional signing load in a first-order 3.3 V rail model.',\n",
              "    description: 'USB rail, decoupling, mutually exclusive Cortex-M active/WFI loads, display load and signing load in a first-order 3.3 V model.',\n",
              1,
          )
          path.write_text(source)

          path = Path('src/main.tsx')
          source = path.read_text()
          source = source.replace(
              "  const displayClosed = booleanParameter('display', true);\n  const signingClosed = booleanParameter('signing', false);\n",
              "  const awake = booleanParameter('awake', true);\n  const displayClosed = booleanParameter('display', true);\n  const signingClosed = booleanParameter('signing', false);\n",
              1,
          )
          source = source.replace(
              "      if (component.id === 's-display') {\n",
              "      if (component.id === 's-mcu-active') {\n        return { ...component, properties: { ...component.properties, closed: awake } };\n      }\n      if (component.id === 's-mcu-sleep') {\n        return { ...component, properties: { ...component.properties, closed: !awake } };\n      }\n      if (component.id === 's-display') {\n",
              1,
          )
          path.write_text(source)

          path = Path('src/domain/examples.test.ts')
          source = path.read_text()
          source = source.replace(
              "    expect(byId.get('r-mcu')).toMatchObject({\n      kind: 'resistor',\n      properties: { resistance: 73.3 },\n    });\n",
              "    expect(byId.get('r-mcu-active')).toMatchObject({\n      kind: 'resistor',\n      properties: { resistance: 73.3 },\n    });\n    expect(byId.get('r-mcu-sleep')).toMatchObject({\n      kind: 'resistor',\n      properties: { resistance: 33_000 },\n    });\n    expect(byId.get('s-mcu-active')).toMatchObject({\n      kind: 'switch',\n      properties: { closed: true, offResistance: 10e6 },\n    });\n    expect(byId.get('s-mcu-sleep')).toMatchObject({\n      kind: 'switch',\n      properties: { closed: false, offResistance: 10e6 },\n    });\n",
              1,
          )
          source = source.replace(
              "    expect(endpoints).toContain('s-display.b->r-display.a');\n",
              "    expect(endpoints).toContain('s-mcu-active.b->r-mcu-active.a');\n    expect(endpoints).toContain('r-mcu-active.b->g-wallet.gnd');\n    expect(endpoints).toContain('s-mcu-sleep.b->r-mcu-sleep.a');\n    expect(endpoints).toContain('r-mcu-sleep.b->g-wallet.gnd');\n    expect(endpoints).toContain('s-display.b->r-display.a');\n",
              1,
          )
          path.write_text(source)
          PY

      - name: Verify model and UI
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build

      - name: Commit and remove trigger
        shell: bash
        run: |
          rm .github/workflows/wallet-sleep-load-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Model Cortex-M active and WFI power branches"
          git pull --rebase origin main
          git push origin main
