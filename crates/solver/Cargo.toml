[package]
name = "nodspice-solver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thiserror = "2"
wasm-bindgen = "0.2"

[dev-dependencies]
approx = "0.5"

# Rust 1.98 emits bulk-memory/non-trapping conversion instructions that are
# supported by modern browsers, but wasm-pack 0.15 currently bundles a
# Binaryen validator profile that rejects them during wasm-opt. Cargo's release
# profile still applies size optimization, LTO and stripping; skip only the
# incompatible post-processing pass until wasm-pack updates Binaryen.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
